spring.application.name=chorequest

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chorequest}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (db/migration); Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://chore-quest.eu.auth0.com/
auth0.audience=https://chorequest-api
